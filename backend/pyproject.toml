[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "chroma>=0.2.0",
    "chromadb>=1.5.9",
    "db>=0.1.1",
    "fastapi[standard]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.5",
    "pypdf>=6.19.0",
]

[tool.fastapi]
entrypoint = "main:app"
